<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Rock Paper Scissors</title>
	<link rel="stylesheet" href="styles/12-rock-paper-scissors.css">
</head>
<body>
	<div class="main-section">
		<p class="title">Rock Paper Scissors</p>
		<button class="move-button js-rock-button" > <!--onclick="playGame('rock');"-->
			<img  class="move-icon" src="img/rock-emoji.png" alt="rock icon">
		</button>
		<button class="move-button js-paper-button">
			<img class="move-icon" src="img/paper-emoji.png" alt="paper icon">
		</button>
		<button class="move-button" onclick="playGame('scissors');">
			<img class="move-icon" src="img/scissors-emoji.png" alt="paper icon">
		</button>
        <p class="result js-result"></p>
        <p class="js-moves"></p>
        <p class="score js-score"></p>
		<button class="reset-score-button" onclick="score.wins = 0; score.loses = 0; score.ties = 0; localStorage.removeItem('score'); updateScoreElement();">
			Reset score
		</button>
		<button class="auto-play-buton" onclick="autoPlay();">Auto Play</button>
	</div>
	<script src="JSfiles/12-rock-paper-scissors.js">

	</script>
</body>
</html>
